[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stabilizer-python-sdk"
version = "0.4.0"
description = "Standalone Python SDK and CLI for the Stabilizer API."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Stabilizer" }]
license = { file = "LICENSE" }
keywords = [
    "stabilizer",
    "llm",
    "extraction",
    "prompt-optimization",
    "structured-output",
    "sdk",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://stabilizerapi.documentinsight.ai/api"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stabilizer_python_sdk*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: live round-trip CLI tests against the Stabilizer API",
]
